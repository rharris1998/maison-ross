<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ross Home preview</title><style>html,body{margin:0;background:#080b11}</style></head>
<body><ross-home></ross-home>
<script type="module">
// A mocked Home Assistant: Ross's states as of 2 October, areas, a forecast
// and a todo list. Service calls are logged and applied to the states.
import '../src/ross-home.js';
const q = new URLSearchParams(location.search);
const now = Date.now(), iso = (minsAgo) => new Date(now - minsAgo * 60000).toISOString();
const snap = (a, b) => 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="640" height="360" fill="url(#g)"/><rect x="40" y="200" width="560" height="160" fill="rgba(0,0,0,.25)"/><circle cx="520" cy="80" r="30" fill="rgba(255,255,255,.25)"/></svg>`);
const S = {};
const add = (entity_id, state, attributes = {}) => { S[entity_id] = {entity_id, state, attributes, last_changed: iso(5), last_updated: iso(5)}; };
const day = q.get('day') === '1';
add('weather.forecast_home', day ? 'sunny' : 'partlycloudy', {temperature: day ? 19.2 : 15.7, humidity: 72, wind_speed: 11, wind_speed_unit: 'km/h', friendly_name: 'Forecast Home'});
add('sun.sun', day ? 'above_horizon' : 'below_horizon', {next_setting: new Date(now + 6 * 3600e3).toISOString(), next_rising: new Date(now + 8 * 3600e3).toISOString()});
add('person.ross', 'home', {friendly_name: 'Ross'});
add('person.evie', q.get('evie') || 'not_home', {friendly_name: 'Evie'});
add('fan.bedroom_purifier', 'on', {preset_modes: ['auto', 'sleep'], preset_mode: 'auto', percentage: null, friendly_name: 'Core 300S Series'});
add('sensor.core_300s_series_air_quality', 'excellent');
add('sensor.core_300s_series_pm2_5', q.get('pm') || '1', {unit_of_measurement: 'µg/m³'});
add('sensor.core_300s_series_filter_lifetime', q.get('filter') || '99', {unit_of_measurement: '%'});
add('switch.core_300s_series_display', 'on');
add('switch.core_300s_series_child_lock', 'off');
add('camera.front_door_live_view', 'idle', {entity_picture: snap('#334155', '#0f172a'), friendly_name: 'Front Door Live view'});
add('camera.garden_live_view', q.get('garden') || 'idle', {entity_picture: snap('#14532d', '#0f172a')});
add('camera.living_room_live_view', 'idle', {entity_picture: snap('#57534e', '#1c1917')});
add('camera.dining_room_live_view', 'idle', {entity_picture: snap('#44403c', '#292524')});
add('sensor.front_door_last_activity', iso(q.get('ding') ? 3 : 48), {category: q.get('ding') ? 'ding' : 'motion', device_class: 'timestamp'});
add('sensor.garden_last_activity', iso(3 * 1440 + 200)); add('sensor.living_room_last_activity', iso(250)); add('sensor.dining_room_last_activity', iso(2 * 1440 + 30));
add('sensor.front_door_battery', 'unknown', {device_class: 'battery', unit_of_measurement: '%'});
['garden', 'living_room', 'dining_room'].forEach((n) => add(`sensor.${n}_battery`, '100', {device_class: 'battery', unit_of_measurement: '%'}));
add('light.garden_light', 'off', {friendly_name: 'Garden Light'});
add('switch.garden_motion_detection', 'off');
add('calendar.waste_collection_schedule_london_borough_of_bexley', 'off');
add('calendar.evie_ross', 'off', {friendly_name: 'Evie + Ross'});
if (!q.get('noenergy')) {
  add('sensor.dcc_sourced_smart_electricity_meter_usage_today', '3.4', {unit_of_measurement: 'kWh', device_class: 'energy', state_class: 'total_increasing'});
  add('sensor.dcc_sourced_smart_electricity_meter_cost_today', '1.62', {unit_of_measurement: 'GBP'});
  add('sensor.dcc_sourced_smart_electricity_meter_rate', '0.2485', {unit_of_measurement: 'GBP/kWh'});
  add('sensor.dcc_sourced_smart_electricity_meter_standing_charge', '0.5342', {unit_of_measurement: 'GBP'});
  add('sensor.thames_water_meter_thames_water_sensor', '165946', {unit_of_measurement: 'L'});
  add('sensor.thames_water_tariff_thames_water_volumetric_rate', '4.2067', {unit_of_measurement: 'GBP/m³'});
}
add('todo.shopping_list', q.get('todo') ? '2' : '0', {friendly_name: 'Shopping list'});
add('sensor.backup_last_successful_automatic_backup', iso(17 * 60));
add('binary_sensor.remote_ui', 'on');
add('sensor.rosss_iphone_battery_level', '100', {device_class: 'battery', unit_of_measurement: '%'});
add('update.home_assistant_core_update', q.get('update') ? 'on' : 'off', {title: 'Home Assistant Core'});
if (q.get('bulbs')) {
  add('light.porch', 'on', {friendly_name: 'Porch', brightness: 200});
  add('light.office_ceiling', 'on', {friendly_name: 'Office ceiling'});
  add('light.office_lamp', 'off', {friendly_name: 'Office lamp'});
}
const areas = {bedroom: {area_id: 'bedroom', name: 'Bedroom'}, living_room: {area_id: 'living_room', name: 'Living Room'}, kitchen: {area_id: 'kitchen', name: 'Kitchen'},
  porch: {area_id: 'porch', name: 'Porch'}, office: {area_id: 'office', name: 'Office'}, garden: {area_id: 'garden', name: 'Garden'}, dining: {area_id: 'dining', name: 'Dining Room'}};
const entities = {'fan.bedroom_purifier': {area_id: 'bedroom'}, 'camera.living_room_live_view': {area_id: 'living_room'}, 'camera.garden_live_view': {area_id: 'garden'},
  'light.garden_light': {area_id: 'garden'}, 'camera.dining_room_live_view': {area_id: 'dining'}, 'camera.front_door_live_view': {area_id: 'porch'},
  'light.porch': {area_id: 'porch'}, 'light.office_ceiling': {area_id: 'office'}, 'light.office_lamp': {area_id: 'office'}};
const days = ['sunny', 'partlycloudy', 'rainy', 'cloudy', 'sunny'].map((c, i) => ({datetime: new Date(now + i * 86400e3).toISOString(), condition: c, temperature: [17, 18, 14, 15, 19][i], templow: [10, 11, 9, 8, 10][i], precipitation: c === 'rainy' ? 4.2 : 0}));
const hours = Array.from({length: 24}, (_, i) => ({datetime: new Date(Math.floor(now / 3600e3) * 3600e3 + (i + 1) * 3600e3).toISOString(), condition: q.get('rain') && i >= 3 && i <= 6 ? 'rainy' : 'partlycloudy',
  temperature: 15 - i * 0.3, precipitation_probability: q.get('rain') && i >= 3 && i <= 6 ? 80 : 10, precipitation: q.get('rain') && i >= 3 && i <= 6 ? 1.2 : 0}));
const history = Array.from({length: 60}, (_, i) => ({s: String(Math.max(0, Math.round(3 + 6 * Math.sin(i / 6) + (i > 40 && i < 46 ? 14 : 0)))), lu: (now - (24 * 3600e3) + i * 24 * 60000) / 1000}));
const todo = q.get('todo') ? [{uid: '1', summary: 'Milk', status: 'needs_action'}, {uid: '2', summary: 'Kajplats bulbs', status: 'needs_action'}] : [];
let hass;
const el = document.querySelector('ross-home');
const push = () => { hass = {...hass, states: {...S}}; el.hass = hass; };
hass = {states: {...S}, areas, entities, devices: {}, user: {name: 'Ross Harrison'}, themes: {darkMode: true}, config: {version: '2026.9.4'},
  connection: {subscribeMessage: async (cb, msg) => { setTimeout(() => cb({forecast: msg.forecast_type === 'hourly' ? hours : days}), 50); return () => {}; }},
  callWS: async (m) => {
    if (m.type === 'todo/item/list') return {items: todo};
    if (m.type === 'recorder/statistics_during_period') {
      if (q.get('fresh')) return {};
      const day = (n) => { const d = new Date(now); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - n); return d.getTime(); };
      const out = {'sensor.dcc_sourced_smart_electricity_meter_usage_today': [], 'sensor.thames_water_meter_thames_water_sensor': []};
      for (let n = 14; n >= 1; n--) out['sensor.dcc_sourced_smart_electricity_meter_usage_today'].push({start: day(n), change: 5 + 3 * Math.sin(n) + (n % 7 < 2 ? 3 : 0)});
      for (let n = 14; n >= 3; n--) out['sensor.thames_water_meter_thames_water_sensor'].push({start: day(n), change: 260 + 80 * Math.cos(n)});
      return out;
    }
    if (m.type === 'history/history_during_period') return {[m.entity_ids[0]]: history};
    return {};
  },
  callApi: async (method, path) => {
    const ymd = (n) => { const d = new Date(now + n * 86400e3); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
    const first = Number(q.get('bins') ?? 6);
    const ev = (n, summary) => ({start: {date: ymd(n)}, end: {date: ymd(n + 1)}, summary});
    const at = (n, h, m = 0) => { const d = new Date(now + n * 86400e3); d.setHours(h, m, 0, 0); return d.toISOString(); };
    if (path.startsWith('calendars/calendar.evie_ross')) return [ev(6, 'Bin Day - Food '), {start: {dateTime: at(0, 23, 0)}, end: {dateTime: at(0, 23, 59)}, summary: 'Late film'},
      {start: {dateTime: at(1, 11)}, end: {dateTime: at(1, 13)}, summary: 'Padel with Sam', location: 'Padel Social Club, Greenwich\nLondon'}, ev(2, 'Evie\'s mum visiting'),
      {start: {dateTime: at(3, 18, 30)}, end: {dateTime: at(3, 19, 30)}, summary: 'Chest & Triceps'}, {start: {dateTime: at(4, 18, 30)}, end: {dateTime: at(4, 19, 30)}, summary: 'Hips & Glutes'}];
    if (path.startsWith('calendars/')) return [ev(first, 'Brown Wheelie (Garden waste)'), ev(first, 'Brown Caddy (Food waste)'), ev(first, 'White Lidded Wheelie (Plastics, cans and glass)'),
      ev(first + 7, 'Brown Caddy (Food waste)'), ev(first + 7, 'Blue Lidded Wheelie (Paper and card)'), ev(first + 7, 'Green Wheelie (Non-recyclable waste)')];
    return [];
  },
  callService: async (d, s, data) => {
    console.log('service', d, s, JSON.stringify(data));
    const ids = [].concat(data.entity_id || []);
    for (const id of ids) { const st = S[id]; if (!st) continue;
      if (s === 'toggle') st.state = st.state === 'on' ? 'off' : 'on';
      if (s === 'turn_off') st.state = 'off'; if (s === 'turn_on') st.state = 'on';
      if (s === 'set_preset_mode') { st.state = 'on'; st.attributes = {...st.attributes, preset_mode: data.preset_mode, percentage: null}; }
      if (s === 'set_percentage') { st.state = 'on'; st.attributes = {...st.attributes, preset_mode: null, percentage: data.percentage}; }
      S[id] = {...st, last_updated: new Date().toISOString()};
    }
    push();
  }};
el.setConfig({});
el.hass = hass;
window.__push = push; window.__S = S;
window.__ding = () => { S['sensor.front_door_last_activity'] = {...S['sensor.front_door_last_activity'], state: new Date().toISOString(), attributes: {category: 'ding', device_class: 'timestamp'}, last_updated: new Date().toISOString()}; push(); };
</script></body></html>
