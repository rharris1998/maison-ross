name: Release

# Every push to main builds dist/maison-ross.js from src/ross-home.js and
# publishes it as a GitHub release, which HACS offers as an update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install esbuild
        run: npm install --no-save --no-package-lock esbuild@0.24.0
      - name: Build
        run: VERSION="v2.0.${{ github.run_number }}" node tools/build-ross-home.mjs
      - name: Check it parses
        run: node --check dist/maison-ross.js
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v2.0.${{ github.run_number }}"
          gh release create "$tag" dist/maison-ross.js --title "Ross Home $tag" --notes "Built from ${{ github.sha }}."
