<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maison · component gallery</title>
<style>
  html,body{margin:0;min-height:100%;background:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body.dark{background:#111113;color:#fafafa}
  #maison-gallery{display:block;min-height:100vh}
</style>
<div id="maison-gallery" aria-live="polite">Loading Maison component gallery…</div>
<script type="module">
  import {mountGallery} from '/maison/vendor/maison-gallery.js';
  import {screen} from '/maison/screen.js?v=38';
  const theme=new URL(location.href).searchParams.get('theme')==='dark'?'dark':'light';
  document.body.classList.toggle('dark',theme==='dark');
  const target=document.querySelector('#maison-gallery');
  // Deterministic version of the same slotted host fixture as the full preview.
  if(new URLSearchParams(location.search).get('host')==='slotted'){
    const shell=document.createElement('maison-preview-shell');
    shell.attachShadow({mode:'open'}).innerHTML='<style>:host{display:block;height:100dvh}.ha-view{height:100%;overflow:auto;overscroll-behavior:contain}</style><div class="ha-view"><slot></slot></div>';
    const panel=document.createElement('maison-preview-panel');
    panel.attachShadow({mode:'open'}).innerHTML='<style>:host{display:block}</style><slot></slot>';
    target.replaceWith(shell);shell.append(panel);panel.append(target);
  }
  // ?view=pages shows every page whole in every frame size instead of the
  // sections. A ?design left in a URL is ignored.
  const view=new URLSearchParams(location.search).get('view')==='pages'?'pages':null;
  mountGallery(target,{theme,screen,view});
</script>
</html>
